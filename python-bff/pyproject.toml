[project]
name = "xxzx-bff"
version = "0.1.0"
description = "XX甄选 BFF — FastAPI backend for AIGC product image generation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.28",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.37",
    "pillow>=11.0",
    "dashscope",
    "loguru>=0.7",
    "tenacity>=9.1",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
